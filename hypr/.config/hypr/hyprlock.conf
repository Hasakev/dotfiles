# Matches the Quickshell bar: slate glass, cool ink, one electric-blue accent.
# (previous config: hyprlock.conf.pre-quickshell)

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = ease, 0.25, 1, 0.5, 1
    animation = fade, 1, 5, ease
    animation = inputFieldDots, 1, 2, ease
}

# Blurred snapshot of whatever is on screen (follows wallpaper-engine).
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.55
    contrast = 1.05
    vibrancy = 0.15
    noise = 0.012
}

# Time
label {
    monitor =
    text = $TIME
    font_family = Inter Display Light
    font_size = 112
    color = rgba(227, 233, 243, 0.95)
    position = 0, 190
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +'%A, %-d %B'
    font_family = Inter
    font_size = 17
    color = rgba(154, 165, 184, 1.0)
    position = 0, 95
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 50
    rounding = 14
    outline_thickness = 1
    outer_color = rgba(227, 233, 243, 0.08)
    inner_color = rgba(11, 14, 21, 0.78)
    font_color = rgba(227, 233, 243, 1.0)
    font_family = Inter
    check_color = rgba(111, 168, 255, 1.0)
    fail_color = rgba(255, 92, 138, 1.0)
    fail_text = <i>$FAIL</i>
    capslock_color = rgba(240, 179, 94, 1.0)
    placeholder_text = <span foreground="##7d889c">Password</span>
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    fade_on_empty = false
    position = 0, -40
    halign = center
    valign = center
}

# Now playing (empty when nothing is)
label {
    monitor =
    text = cmd[update:2000] playerctl metadata --format '{{title}}  ·  {{artist}}' 2>/dev/null
    font_family = Inter
    font_size = 12
    color = rgba(125, 136, 156, 1.0)
    position = 0, 40
    halign = center
    valign = bottom
}
