# ~/.config/kitty/kitty.conf
#selection_background
#
#
font_family JetBrainsMono Nerd Font

background #0a0f1f
foreground #cdd6f4

color0  #0a0f1f
color8  #4a5a7a   # zsh-autosuggestions hint colour — muted blue-grey, visible on #0a0f1f

color1  #ff2e88
color2  #22d3ee
color4  #4fa3ff
color5  #7c3aed

# Make selection clearly visible but still neon

selection_background #1f2a44
selection_foreground #cdd6f4

# Better contrast for hints
mark1_background #4fa3ff
mark1_foreground #0a0f1f

mark2_background #22d3ee
mark2_foreground #0a0f1f

# Cursor contrast
cursor #22d3ee
cursor_text_color #0a0f1f
allow_remote_control yes
